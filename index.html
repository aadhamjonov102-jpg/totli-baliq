<!doctype html>
<html lang="uz">
<head>

  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('tb-tema'); } catch (e) {}

      document.documentElement.dataset.theme = t;
    })();

  <link rel="stylesheet" href="style.css">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

      <path d="M6 24C18 3 46 3 62 24 46 45 18 45 6 24Z" fill="currentColor"/>
      <path d="M58 24 78 7 73 24 78 41Z" fill="currentColor"/>
      <path d="M28 7C34 0 44 1 48 8 42 9 34 9 28 7Z" fill="currentColor" opacity=".7"/>
      <circle cx="19" cy="21" r="2.6" fill="#06141b"/>
      <path d="M31 12C27 20 27 28 31 36" fill="none" stroke="#06141b" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>

    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>

      <span class="logo"><svg class="ic fill"><use href="#i-fish"/></svg></span>
      <b>Totli baliq</b>

    <nav class="links" id="nav">
      <a href="#bosh" data-go="bosh">Menyu</a>
      <a href="#buyurtma" data-go="buyurtma">Buyurtma<span id="cartBadge" class="badge" hidden></span></a>
      <a href="#xonalar" data-go="xonalar">Xonalar</a>
      <a href="#admin" data-go="admin">Admin</a>
    </nav>
    <button type="button" id="installBtn" class="tool-btn wide" hidden><svg class="ic"><use href="#i-download"/></svg><span>O‘rnatish</span></button>
    <button type="button" id="themeBtn" class="tool-btn" aria-label="Yorug‘/qorong‘i rejim" title="Yorug‘/qorong‘i rejim"><svg class="ic"><use href="#i-sun"/></svg></button>

  <div id="banner" class="banner" hidden></div>
  <main id="view" aria-live="polite"></main>

  <a id="cartBar" class="cartbar" href="#buyurtma" hidden>

  <script src="admin.js"></script>
